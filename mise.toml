# Tasks for developing gh-desk: mise tasks lists them, mise run <task> runs one.
# Go comes from wherever you have it (go.mod sets the minimum), the other
# tools from [tools] below.

[tools]
golangci-lint = "2.15.0"
# The checks of the settings page (internal/config/ui)
node = "24"
# The docs site (docs/site); extended, which the Hextra theme asks for
"aqua:gohugoio/hugo/hugo-extended" = "0.168.0"

[tasks.build]
description = "Build ./gh-desk"
run = "go build -trimpath -o gh-desk ."

[tasks.install]
description = "Install ./gh-desk as a gh extension, from this checkout"
depends = ["build"]
run = "gh extension install . --force"

[tasks.clean]
description = "Remove ./gh-desk, dist and coverage.out"
run = "rm -rf gh-desk dist coverage.out"

[tasks.test]
description = "Check formatting, and run the Go tests with the race detector, writing coverage.out"
run = '''
test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt: the files above are not formatted"; exit 1; }
go test -race ./... -coverprofile=coverage.out -covermode=atomic
'''

[tasks.lint]
description = "Run golangci-lint, and check that go.mod and go.sum are tidy"
run = '''
golangci-lint run ./...
go mod tidy -diff
'''

[tasks.vuln]
description = "Check the dependencies and the standard library for known vulnerabilities"
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./..."

[tasks.demo]
description = "Record the demo with VHS in Docker into docs/demo.gif: mise run demo [TAPE ...]"
file = "demo/recording/tapes/record.sh"

[tasks."site:build"]
description = "Build the whole site, the landing page, the playground and the docs, into ./site"
run = "demo/site/build.sh"

[tasks."site:serve"]
description = "Build the site and serve it as published on http://localhost:8080/gh-desk/"
run = "demo/site/serve.sh"

[tasks."site:test"]
description = "Check that the site builds: gh-desk compiled to WebAssembly against demo/internal/playground, every link of the docs leads to a page, and Hugo warns of nothing"
run = '''
test -z "$(gofmt -l demo/site)" || { gofmt -l demo/site; echo "gofmt: the files above are not formatted"; exit 1; }
out=$(mktemp -d)
trap 'rm -rf "$out"' EXIT
demo/site/build.sh "$out"
'''

[tasks."config-ui:test"]
description = "Check the settings page without a browser: its list against gh-desk's, and what it writes"
run = "node internal/config/ui/check.mjs"
