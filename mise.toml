# Tasks for developing gh-triage: mise tasks lists them, mise run <task> runs one.
# Go comes from wherever you have it (go.mod sets the minimum), the other
# tools from [tools] below.

[tools]
golangci-lint = "2.15.0"

[tasks.build]
description = "Build ./gh-triage"
run = "go build -trimpath -o gh-triage ."

[tasks.install]
description = "Install ./gh-triage as a gh extension, from this checkout"
depends = ["build"]
run = "gh extension install . --force"

[tasks.clean]
description = "Remove ./gh-triage and coverage.out"
run = "rm -f gh-triage coverage.out"

[tasks.test]
description = "Check formatting, and run the Go tests with the race detector, writing coverage.out"
run = '''
test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt: the files above are not formatted"; exit 1; }
go test -race ./... -coverprofile=coverage.out -covermode=atomic
'''

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."
