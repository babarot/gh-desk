# Tasks for developing gh-desk: mise tasks lists them, mise run <task> runs one.
# Go comes from wherever you have it (go.mod sets the minimum), the other
# tools from [tools] below.

[tools]
golangci-lint = "2.15.0"
# The checks of the page of config ui (internal/configui)
node = "24"
# The docs site (docs/site); extended, which the Hextra theme asks for
"aqua:gohugoio/hugo/hugo-extended" = "0.168.0"

[tasks.build]
description = "Build ./gh-desk"
run = "go build -trimpath -o gh-desk ."

[tasks.install]
description = "Install ./gh-desk as a gh extension, from this checkout"
depends = ["build"]
run = "gh extension install . --force"

[tasks.clean]
description = "Remove ./gh-desk, dist and coverage.out"
run = "rm -rf gh-desk dist coverage.out"

[tasks.test]
description = "Check formatting, and run the Go tests with the race detector, writing coverage.out"
run = '''
test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt: the files above are not formatted"; exit 1; }
go test -race ./... -coverprofile=coverage.out -covermode=atomic
'''

[tasks.lint]
description = "Run golangci-lint, and check that go.mod and go.sum are tidy"
run = '''
golangci-lint run ./...
go mod tidy -diff
'''

[tasks.vuln]
description = "Check the dependencies and the standard library for known vulnerabilities"
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./..."

[tasks.demo]
description = "Record the demo with VHS in Docker into docs/demo.gif: mise run demo [TAPE ...]"
file = "demo/recording/tapes/record.sh"

[tasks."site:build"]
description = "Build the demo on the site (gh-desk compiled to WebAssembly) into demo/site/web"
run = "demo/site/build.sh"

[tasks."site:serve"]
description = "Build the site and serve it on http://127.0.0.1:8080"
depends = ["site:build"]
run = "python3 -m http.server 8080 --bind 127.0.0.1 --directory demo/site/web"

[tasks."site:test"]
description = "Check that the site builds: gh-desk compiled to WebAssembly against demo/internal/playground"
run = '''
test -z "$(gofmt -l demo/site)" || { gofmt -l demo/site; echo "gofmt: the files above are not formatted"; exit 1; }
demo/site/build.sh
'''

[tasks."configui:test"]
description = "Check the page of gh desk config ui without a browser: its list against gh-desk's, and what it writes"
run = "node internal/configui/check.mjs"

[tasks."docs:build"]
description = "Build the docs site (Hugo with Hextra) from docs/ into ./site"
run = "docs/site/build.sh"

[tasks."docs:serve"]
description = "Build the playground and the docs as published, and serve them on http://localhost:8080/gh-desk/"
run = "docs/site/preview.sh"

[tasks."docs:test"]
description = "Check that the docs site builds: every link leads to a page, and Hugo warns of nothing"
run = '''
out=$(mktemp -d)
trap 'rm -rf "$out"' EXIT
docs/site/build.sh "$out"
'''
