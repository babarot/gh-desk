name: Go

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '**/*.go'
      - '**/testdata/**'
      - 'go.mod'
      - 'go.sum'
      - 'docs/architecture.md'
      - 'mise.toml'
      - '.golangci.yaml'
      - '.octocov.yaml'
      - '.github/workflows/build.yaml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.9.18
      - name: Run golangci-lint
        run: mise run lint

  test:
    strategy:
      matrix:
        # Add macos-latest once the repository is public: while it is private,
        # a minute on macOS uses ten of the free Actions minutes
        os: ['ubuntu-latest']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.9.18
      - name: Run tests
        run: mise run test
      - name: Run octocov
        if: runner.os == 'Linux'
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
