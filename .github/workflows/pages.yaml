name: Pages

# The site at babarot.me/gh-desk/: the landing page, under it the playground,
# gh-desk compiled to WebAssembly against the made-up GitHub of
# demo/internal/playground, and the docs, built from docs/ with Hugo. It is published when a
# release is made, from the commit released, so that the playground, the
# docs and the version the docs name are those of the gh-desk people
# install (ADR-055). Release calls it. It can be run by hand on main, which
# publishes main; the github-pages environment refuses any other branch. A
# release is published again by re-running the pages job of its run.
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The playground's module and Hugo's theme are Go modules
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            demo/site/go.sum
            docs/site/go.sum
      # Hugo comes from mise.toml
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.9.18
      - run: demo/site/build.sh
      - run: docs/site/build.sh demo/site/web/docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: demo/site/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One publish at a time, the later waiting: a publish cut short would
    # leave the site half of one version
    concurrency:
      group: pages
      cancel-in-progress: false
    # deploy-pages publishes with an OIDC token
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
