name: Pages

# The site: gh-desk compiled to WebAssembly, running in the browser against
# the made-up GitHub of internal/demo/playground. It is built from the code on main, so it
# is deployed whenever that code changes.
on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            site/go.sum
      - run: site/build.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # deploy-pages publishes with an OIDC token
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
