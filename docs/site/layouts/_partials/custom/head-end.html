<script>
// An embedded screen of the playground loads when it is scrolled to, and
// plays its scenario at once, as a muted video starts; until then it is a
// card, so a page with several does not run them all. The button loads it
// too, where scrolling does not tell.
(() => {
  const load = b => {
    if (!b.isConnected) return;
    const f = document.createElement('iframe');
    // A frame reads the key the theme is kept under, and hears of a switch
    // through it; on system the frame follows the OS by itself.
    const theme = localStorage.getItem('color-theme');
    f.src = b.dataset.src;
    if (theme === 'dark' || theme === 'light') {
      f.src += (b.dataset.src.includes('?') ? '&' : '?') + 'theme=' + theme;
    }
    f.title = b.dataset.title;
    f.allow = 'clipboard-write';
    b.closest('.desk-pg').replaceChildren(f);
  };
  document.addEventListener('click', e => {
    const b = e.target.closest('.desk-pg-run');
    if (b) load(b);
  });
  document.addEventListener('DOMContentLoaded', () => {
    if (!('IntersectionObserver' in window)) return;
    const seen = new IntersectionObserver(entries => entries.forEach(en => {
      if (!en.isIntersecting) return;
      seen.unobserve(en.target);
      load(en.target);
    }), { threshold: 0.3 });
    document.querySelectorAll('.desk-pg-run').forEach(b => seen.observe(b));
  });
})();
</script>
<script>
// Each click goes on to the next of system, light and dark, as on the
// landing page, in place of Hextra's menu. Its items do the switching, so what
// they keep and the icon they set are Hextra's own.
(() => {
  document.addEventListener('click', e => {
    if (!e.target.closest('.hextra-theme-toggle')) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    const now = localStorage.getItem('color-theme');
    const next = { light: 'dark', dark: 'system' }[now] || 'light';
    document.querySelector(`.hextra-theme-toggle-options [data-item=${next}]`).click();
  }, true);
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.hextra-theme-toggle').forEach(b => {
      b.removeAttribute('aria-haspopup');
      b.removeAttribute('aria-expanded');
    });
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (localStorage.getItem('color-theme') === 'system') setTheme('system');
  });
})();
</script>
<script>
// The version the docs are of, where Hextra puts the language switch on a
// site with more than one language: the foot of the sidebar, left of the
// theme switch. Hextra has no place of its own for it there.
document.addEventListener('DOMContentLoaded', () => {
  const bar = document.querySelector('aside .hx\\:sticky.hx\\:bottom-0');
  if (!bar) return;
  const a = document.createElement('a');
  a.className = 'desk-version';
  a.href = {{ printf "%s/releases/tag/v%s" site.Params.repository site.Params.version }};
  a.textContent = {{ printf "gh-desk v%s" site.Params.version }};
  bar.prepend(a);
});
</script>
