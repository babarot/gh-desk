<script>
// An embedded screen of the playground starts when it is asked for, in
// the theme the docs are shown in.
document.addEventListener('click', e => {
  const b = e.target.closest('.desk-pg-run');
  if (!b) return;
  const f = document.createElement('iframe');
  const theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
  f.src = b.dataset.src + '&theme=' + theme;
  f.title = b.dataset.title;
  f.allow = 'clipboard-write';
  b.closest(".desk-pg").replaceChildren(f);
  f.focus();
});
</script>
<script>
// The version the docs are of, where Hextra puts the language switch on a
// site with more than one language: the foot of the sidebar, left of the
// theme switch. Hextra has no place of its own for it there.
document.addEventListener('DOMContentLoaded', () => {
  const bar = document.querySelector('aside .hx\\:sticky.hx\\:bottom-0');
  if (!bar) return;
  const a = document.createElement('a');
  a.className = 'desk-version';
  a.href = {{ printf "%s/releases/tag/v%s" site.Params.repository site.Params.version }};
  a.textContent = {{ printf "gh-desk v%s" site.Params.version }};
  bar.prepend(a);
});
</script>
