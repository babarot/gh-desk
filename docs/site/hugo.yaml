# The documentation site, under the playground at babarot.me/gh-desk/.
# The pages are the Markdown files in docs/, which build.sh copies in;
# see build.sh for which ones and how.
baseURL: https://babarot.me/gh-desk/docs/
title: gh-desk
locale: en-US
enableRobotsTXT: true
disableKinds:
- taxonomy
- term

module:
  hugoVersion:
    extended: true
    min: 0.160.0
  imports:
  - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    noClasses: false

menu:
  main:
  # The playground on the whole window, play/ beside the docs. A url
  # starting with / is taken from the base URL (/gh-desk/docs/), so
  # /../play/ is it wherever the site is served; ../play/ alone would be
  # read from each page, and a query is dropped from a menu's url.
  - name: Playground
    weight: 1
    url: /../play/
  - name: Search
    weight: 2
    params:
      type: search
  - name: GitHub
    weight: 3
    url: https://github.com/babarot/gh-desk
    params:
      icon: github

params:
  description: A desk in your terminal for the pull requests waiting on you.
  # The playground's address; a link to it in a page is taken to the
  # playground next to the docs, and one titled "playground" is embedded.
  playground: https://babarot.me/gh-desk/
  repository: https://github.com/babarot/gh-desk
  navbar:
    displayTitle: true
    displayLogo: false
  theme:
    default: system
    displayToggle: true
  editURL:
    enable: true
    base: https://github.com/babarot/gh-desk/edit/main/docs
  footer:
    displayCopyright: false
    displayPoweredBy: false
  page:
    width: wide
